<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Dungeoneers | Guild Tools</title>

    <!-- Open Graph / Discord Embeds -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Dungeoneers | Guild Tools" />
    <meta property="og:description" content="Guild management CTA signups for The Dungeoneers and alies in Albion Online." />
    <meta property="og:image" content="https://i.ibb.co/Z6WgyHbJ/dungeoneers-banner.png" />
    <meta property="og:url" content="https://dareirus-sheet.onrender.com/" />
    <meta name="theme-color" content="#28502A" />

    <!-- Twitter Card / Large Discord Embed -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Dungeoneers | Guild Tools" />
    <meta name="twitter:description" content="Guild management CTA signups for The Dungeoneers and alies in Albion Online." />
    <meta name="twitter:image" content="https://i.ibb.co/Z6WgyHbJ/dungeoneers-banner.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-abyss: #07090d;
        --bg-surface: #0e1218;
        --border-gold: rgba(230, 177, 92, 0.3);
        --gold-primary: #e6b15c;
        --gold-light: #f5cf8e;
        --gold-dim: #997334;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --font-display: 'Cinzel', serif;
        --font-body: 'Plus Jakarta Sans', sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: var(--bg-abyss);
        color: var(--text-primary);
        font-family: var(--font-body);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 1.5rem;
      }

      .preview-card {
        background: var(--bg-surface);
        border: 1px solid var(--border-gold);
        border-radius: 16px;
        padding: 2.5rem 2rem;
        max-width: 520px;
        width: 100%;
        text-align: center;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(230, 177, 92, 0.1);
      }

      .preview-banner {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-bottom: 1.5rem;
      }

      .preview-title {
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 0.75rem;
        background: linear-gradient(135deg, #ffffff 40%, var(--gold-light) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .preview-desc {
        color: var(--text-secondary);
        font-size: 0.92rem;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .btn-portal {
        display: inline-block;
        width: 100%;
        padding: 0.9rem 1.5rem;
        background: linear-gradient(135deg, var(--gold-primary), var(--gold-dim));
        color: #07090d;
        font-family: var(--font-display);
        font-size: 0.9rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(230, 177, 92, 0.25);
        transition: all 0.2s ease;
      }

      .btn-portal:hover {
        background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
        box-shadow: 0 6px 22px rgba(230, 177, 92, 0.4);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="preview-card">
      <img
        src="https://i.ibb.co/Z6WgyHbJ/dungeoneers-banner.png"
        alt="The Dungeoneers Banner"
        class="preview-banner"
      />
      <h1 class="preview-title">The Dungeoneers</h1>
      <p class="preview-desc">Guild management CTA signups for The Dungeoneers and alies in Albion Online.</p>
      <a href="/auth/login/" class="btn-portal">Enter Guild Portal</a>
    </div>
  </body>
</html>
